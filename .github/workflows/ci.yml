name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # preview build: reviewers install this instead of building locally
      - if: github.event_name == 'pull_request'
        run: npx @vscode/vsce package -o ptal-pr.vsix
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ptal-vsix-preview
          path: ptal-pr.vsix
